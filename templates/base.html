<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Image Analyzer{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
    
    {% block head %}{% endblock %}
</head>
<body>

    <!-- Animated Background -->
    <div id="bg-canvas"></div>

    <!-- Premium Navbar -->
    <nav class="nav-premium">
        <div class="container">
            <a class="nav-brand" href="{{ url_for('index') }}">
                <div class="nav-logo">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <div>
                    <div class="nav-title">Image<span>Analyzer</span></div>
                    <div class="nav-sub">by Hidden_Rhythm</div>
                </div>
            </a>
            <div class="nav-status">
                <span class="nav-dot"></span>
                <span class="nav-status-text">System Active</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Premium Footer -->
    <footer class="footer-pro">
        <div class="container">
            <div class="footer-content">
                <div class="footer-text">
                    <i class="fas fa-code" style="color:var(--primary);"></i>
                    Built with <span class="heart">❤</span> by <span class="credit">Hidden_Rhythm</span>
                </div>
                <div class="footer-version">
                    <i class="fas fa-shield-alt" style="color:var(--accent);"></i>
                    Forensic Image Analysis v2.0
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
